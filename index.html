<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出張手洗い洗車 簡易見積シミュレーション</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start antialiased">

    <!-- PC/タブレット/スマホ共通のラッパー（PCではスマホアプリ風のカードコンテナになる） -->
    <div class="w-full max-w-lg min-h-screen bg-slate-900 shadow-2xl flex flex-col relative pb-32 border-x border-slate-800">

        <!-- ヘッダー -->
        <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700/80 py-4 px-6 sticky top-0 z-35 shadow-md">
            <div class="flex justify-between items-center">
                <h1 class="text-base font-bold tracking-wider text-cyan-400">CAR WASH SIMULATOR</h1>
                <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">出張手洗い洗車</span>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="p-4 sm:p-6 space-y-6 flex-1">

            <!-- イントロ -->
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4 text-sm text-slate-300 leading-relaxed">
                ご自宅にいる間に本格的な純水手洗い洗車をお届けします。車種とオプションを選ぶだけで、その場でだいたいの料金と作業時間が確認できます。
            </div>

            <!-- STEP 1: 車種クラス選択 -->
            <section class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 sm:p-5 shadow-lg">
                <h2 class="text-xs sm:text-sm font-semibold text-cyan-400 uppercase tracking-wider mb-3">Step 1. 車種クラスを選択</h2>
                <div class="space-y-2.5" id="car-classes">
                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="radio" name="carClass" value="3000" data-name="Sクラス（軽自動車）" class="text-cyan-500 focus:ring-cyan-400 h-4 w-4" checked>
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">Sクラス</p>
                                <p class="text-xs text-slate-400">軽自動車（N-BOX, アルト等）</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">¥3,000</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="radio" name="carClass" value="4000" data-name="Mクラス（コンパクト・セダン）" class="text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">Mクラス</p>
                                <p class="text-xs text-slate-400">コンパクト・セダン（アクア, プリウス等）</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">¥4,000</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="radio" name="carClass" value="5000" data-name="Lクラス（SUV・ワゴン）" class="text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">Lクラス</p>
                                <p class="text-xs text-slate-400">SUV・ワゴン（RAV4, レヴォーグ等）</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">¥5,000</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="radio" name="carClass" value="6500" data-name="LLクラス（大型SUV・大型ミニバン）" class="text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">LLクラス</p>
                                <p class="text-xs text-slate-400">大型SUV・大型ミニバン（ランクル, アルファード等）</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">¥6,500</span>
                    </label>
                </div>
            </section>

            <!-- STEP 2: オプション選択 -->
            <section class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 sm:p-5 shadow-lg">
                <h2 class="text-xs sm:text-sm font-semibold text-cyan-400 uppercase tracking-wider mb-3">Step 2. オプション追加（任意）</h2>
                <div class="space-y-2.5" id="options">
                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" name="option" value="1000" data-name="撥水コーティング仕上げ" data-time="15" class="rounded text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">撥水コーティング仕上げ</p>
                                <p class="text-xs text-slate-400">スプレー施工＆艶出し拭き上げ</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">+¥1,000</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" name="option" value="2000" data-name="スケール・水アカ除去" data-time="30" class="rounded text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">スケール・水アカ除去</p>
                                <p class="text-xs text-slate-400">イオンデポジットの化学除去</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">+¥2,000</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" name="option" value="1500" data-name="鉄粉除去" data-time="20" class="rounded text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">鉄粉除去</p>
                                <p class="text-xs text-slate-400">専用ケミカル噴霧によるザラザラ解消</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">+¥1,500</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" name="option" value="1500" data-name="窓ガラス油膜取り" data-time="15" class="rounded text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">窓ガラス油膜取り</p>
                                <p class="text-xs text-slate-400">視界すっきりクリアに</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">+¥1,500</span>
                    </label>

                    <label class="flex items-center justify-between p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-cyan-500 transition">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" name="option" value="2500" data-name="プレミアム車内リフレッシュ" data-time="30" class="rounded text-cyan-500 focus:ring-cyan-400 h-4 w-4">
                            <div>
                                <p class="font-medium text-sm sm:text-base text-white">プレミアム車内リフレッシュ</p>
                                <p class="text-xs text-slate-400">掃除機・内窓・コックピット拭き上げ</p>
                            </div>
                        </div>
                        <span class="font-bold text-cyan-400">+¥2,500</span>
                    </label>
                </div>
            </section>

        </main>

        <!-- 固定フッター（リアルタイム見積結果） -->
        <footer class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 p-4 shadow-2xl z-30">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400">推定作業時間: <span id="total-time" class="text-white font-bold">約 45</span> 分</p>
                    <div class="flex items-baseline space-x-1">
                        <span class="text-xs text-slate-300">合計（税込）</span>
                        <span id="total-price" class="text-2xl font-black text-cyan-400">¥3,000</span>
                    </div>
                </div>
                <button onclick="alert('シミュレーションありがとうございます！実際の予約フォームやLINE連携に繋げられます。')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-3 rounded-xl shadow-lg transition active:scale-95 text-xs sm:text-sm">
                    この内容で予約・相談
                </button>
            </div>
        </footer>

    </div>

    <!-- 計算ロジック用 JavaScript -->
    <script>
        const carClassRadios = document.querySelectorAll('input[name="carClass"]');
        const optionCheckboxes = document.querySelectorAll('input[name="option"]');
        const totalPriceElement = document.getElementById('total-price');
        const totalTimeElement = document.getElementById('total-time');

        function calculateTotal() {
            let basePrice = 0;
            carClassRadios.forEach(radio => {
                if (radio.checked) {
                    basePrice = parseInt(radio.value);
                }
            });

            let baseTime = 45; 
            let optionsPrice = 0;
            let optionsTime = 0;

            optionCheckboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    optionsPrice += parseInt(checkbox.value);
                    optionsTime += parseInt(checkbox.dataset.time || 0);
                }
            });

            const grandTotal = basePrice + optionsPrice;
            const grandTime = baseTime + optionsTime;

            totalPriceElement.textContent = `¥${grandTotal.toLocaleString()}`;
            totalTimeElement.textContent = `約 ${grandTime}`;
        }

        carClassRadios.forEach(radio => {
            radio.addEventListener('change', calculateTotal);
        });

        optionCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', calculateTotal);
        });

        calculateTotal();
    </script>
</body>
</html>
